[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgebench"
version = "0.1.0"
description = "ForgeBench: JSON-to-HLS generators and benchmark suite for ML accelerators (GEMM, DNN, LLM, full models)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# full-model verification (verification/fullmodel) and the test suite
verify = [
    "torch>=2.4",
    "pytest>=8",
]

[project.scripts]
forgebench = "forgebench.cli:main"

[tool.setuptools.packages.find]
include = ["forgebench*", "paper_artifacts*", "verification*"]

[tool.pytest.ini_options]
testpaths = ["verification/tests", "verification/fullmodel/tests"]
